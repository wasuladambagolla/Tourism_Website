<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Ceylon | Book Your Next Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="index.html"><h1>Beyond Ceylon</h1></a>
        </div>
    </header>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-content">
            <div class="login-box">
                <h2>Welcome Back</h2>
                <p>Sign in to manage your bookings and explore deals</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="login-btn">Sign In</button>
                </form>

                <div id="login-message" class="login-message"></div>


                <p class="register-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            &copy; 2026 Beyond Ceylon. All rights reserved. University Course Project.
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
